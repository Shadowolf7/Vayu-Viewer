id: no-range-loop-copy
message: "Ranged-for loop copies elements by value. Use 'const auto&' or 'auto&' to avoid accidental copies."
severity: warning
language: cpp
rule:
  kind: for_range_loop
  all:
    - has:
        field: declarator
        kind: identifier
    - has:
        field: type
        any:
          - kind: placeholder_type_specifier
          - pattern: "const auto"
